<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>Fozara — One Place for Your Global Money & Payments</title>
    <meta
      name="title"
      content="Fozara — One Place for Your Global Money & Payments"
    />
    <meta
      name="description"
      content="Seamlessly bridge digital assets, crypto, and fiat currency. Hold, convert, send, and spend across borders with Fozara's unified financial network."
    />
    <meta
      name="keywords"
      content="global payments, cross-border money transfer, digital assets, multi-currency wallet, fintech, fiat and crypto, Fozara"
    />
    <meta name="author" content="Fozara" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://fozara.com" />

    <!-- Open Graph / Facebook / LinkedIn Meta Tags (Requires PNG/JPG for preview cards) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fozara.com" />
    <meta
      property="og:title"
      content="Fozara — One Place for Your Global Money & Payments"
    />
    <meta
      property="og:description"
      content="Money enters Fozara once — digital or fiat. Stay, convert, move across borders, or spend in everyday life."
    />
    <meta property="og:image" content="https://fozara.com/og-image.png" />

    <!-- Twitter / X Meta Tags -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://fozara.com" />
    <meta
      property="twitter:title"
      content="Fozara — One Place for Your Global Money & Payments"
    />
    <meta
      property="twitter:description"
      content="Money enters Fozara once — digital or fiat. Stay, convert, move across borders, or spend in everyday life."
    />
    <meta property="twitter:image" content="https://fozara.com/og-image.png" />

    <!-- Schema.org Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FinancialService",
        "name": "Fozara",
        "url": "https://fozara.com",
        "logo": "https://fozara.com/logo.svg",
        "description": "Unified financial network connecting digital assets, crypto, and fiat currency for global money movement.",
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
